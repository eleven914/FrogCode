name: FrogCode CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out FrogCode
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts frog_trace_permission_flow.py

      - name: Type check
        run: uv run mypy src

      - name: Check Frog naming
        run: uv run python scripts/frog_check_naming.py

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Local integration tests
        run: uv run pytest tests/integration --ignore=tests/integration/test_run_e2e.py -q

      - name: Check generated protocol
        run: uv run python scripts/frog_gen_protocol_doc.py --check
